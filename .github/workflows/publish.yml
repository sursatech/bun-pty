name: Publish Package

on:
  release: { types: [created, edited] }
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  RELEASE_DIR: rust-pty/target/release

jobs:
  build-libs:
    runs-on: ${{ matrix.runner }}
    # The FreeBSD leg builds inside a third-party VM and has no hosted runner.
    # A VM/pkg failure must not block npm releases for every other platform.
    continue-on-error: ${{ matrix.freebsd == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.17 builds (RHEL 7+, CentOS 7+, Ubuntu 14.04+, Debian 8+)
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            zigbuild_target: x86_64-unknown-linux-gnu.2.17
            out:    librust_pty.so
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            zigbuild_target: aarch64-unknown-linux-gnu.2.17
            out:    librust_pty_arm64.so
          # musl builds (Alpine Linux and other musl-based distros)
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            zigbuild_target: x86_64-unknown-linux-musl
            out:    librust_pty_musl.so
            rustflags: -C target-feature=-crt-static
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            zigbuild_target: aarch64-unknown-linux-musl
            out:    librust_pty_arm64_musl.so
            rustflags: -C target-feature=-crt-static
          - runner: macos-latest
            target: x86_64-apple-darwin
            out:    librust_pty.dylib
          - runner: macos-latest
            target: aarch64-apple-darwin
            out:    librust_pty_arm64.dylib
          - runner: windows-latest
            target: x86_64-pc-windows-gnu
            out:    rust_pty.dll
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            out:    rust_pty_arm64.dll
            rustflags: -C target-feature=+crt-static
          # FreeBSD has no GitHub-hosted runner, so build it in a FreeBSD VM.
          - runner: ubuntu-22.04
            target: x86_64-unknown-freebsd
            freebsd: true
            out:    librust_pty_freebsd.so

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        if: "!matrix.freebsd"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: "!matrix.freebsd"

      - name: Install zigbuild
        if: matrix.zigbuild_target
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build rust-pty (Linux with zigbuild)
        if: matrix.zigbuild_target
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cd rust-pty
          cargo zigbuild --release --target ${{ matrix.zigbuild_target }}

      - name: Build rust-pty
        if: "!matrix.zigbuild_target && !matrix.freebsd"
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cd rust-pty
          cargo build --release --target ${{ matrix.target }}

      - name: Build rust-pty (FreeBSD)
        if: matrix.freebsd
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          # pkg's rust needs FBSD_1.9 libc, which the 15.0 image lacks.
          # Install the official toolchain via rustup instead.
          prepare: |
            fetch -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --default-toolchain stable --profile minimal
          run: |
            . "$HOME/.cargo/env"
            cd rust-pty
            cargo build --release
            mkdir -p ../out
            cp target/release/librust_pty.so "../out/${{ matrix.out }}"

      - name: Collect artefact
        if: "!matrix.freebsd"
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          src=(rust-pty/target/${{ matrix.target }}/release/*.{so,dylib,dll})
          [[ ${#src[@]} -gt 0 ]] || { echo "❌ no lib"; exit 1; }
          cp "${src[0]}" "out/${{ matrix.out }}"

      - uses: actions/upload-artifact@v7
        with:
          name: compiled-libs-${{ matrix.target }}
          path: out/*

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          fail_on_unmatched_files: true

  publish:
    needs: build-libs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install

      - name: Download all compiled libs
        uses: actions/download-artifact@v8
        with:
          path: downloaded-libs

      - name: Move compiled libs into final release path
        run: |
          mkdir -p ${{ env.RELEASE_DIR }}
          find downloaded-libs -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -exec cp {} ${{ env.RELEASE_DIR }}/ \;

      - name: List bundled libs
        run: ls -R ${{ env.RELEASE_DIR }}

      - name: Build TypeScript declarations
        run: bun run build:ts

      - name: Publish to npm
        run: npm publish
